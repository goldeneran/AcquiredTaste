<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>טעם נרכש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Miriam+Libre:wght@400;700&family=Varela+Round&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAE5D4; --paper-card:#F4F1E5; --ink:#25231C; --muted:#6E6858;
    --line:#C7BE9F; --line-soft:#DAD3B9; --stamp:#B15C36; --stamp-soft:#E9D3C4;
    --transit:#3F5E44; --transit-soft:#D9E3D3;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:'Varela Round',sans-serif;line-height:1.7;
    background-image:radial-gradient(circle at 1px 1px, rgba(37,35,28,0.05) 1px, transparent 0);
    background-size:22px 22px;
  }
  a{color:var(--transit);}
  [hidden]{display:none !important;}

  /* ===== landing ===== */
  #landing{
    min-height:100svh;color:#fff;background-color:#2b2820;
    background-image:
      linear-gradient(to bottom, rgba(20,16,10,.5) 0%, rgba(20,16,10,0) 26%, rgba(20,16,10,0) 36%, rgba(20,16,10,.84) 64%, rgba(20,16,10,.95) 100%),
      url('images/IMG_9102.jpeg');
    background-size:cover;background-position:50% 22%;background-repeat:no-repeat;
  }
  .land-inner{
    min-height:100svh;max-width:640px;margin:0 auto;padding:34px 22px 30px;
    display:flex;flex-direction:column;justify-content:space-between;gap:clamp(230px,32svh,330px);
  }
  @media (min-width:900px){
    #landing{
      background-image:
        linear-gradient(to right, rgba(20,16,10,.88) 0%, rgba(20,16,10,.78) 36%, rgba(20,16,10,0) 62%),
        url('images/IMG_9102.jpeg');
      background-position:50% 16%;
    }
    .land-inner{max-width:540px;margin-inline-start:auto;margin-inline-end:5vw;justify-content:center;gap:32px;}
  }
  #landing h1{
    font-family:'Miriam Libre',serif;font-weight:700;color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.45);
    font-size:clamp(44px,12vw,68px);margin:0 0 8px;letter-spacing:-1px;line-height:1.05;
  }
  #landing .sub{
    margin:0;color:rgba(255,255,255,.92);font-size:16px;text-shadow:0 1px 10px rgba(0,0,0,.5);
    border-bottom:2px solid rgba(255,255,255,.7);padding-bottom:16px;
  }
  #landing .intro p{font-size:15.5px;line-height:1.85;margin:0 0 12px;color:rgba(255,255,255,.95);}
  #landing .intro{margin:0 0 20px;}
  .choices{display:flex;flex-direction:column;gap:12px;}
  .choice{
    display:flex;justify-content:space-between;align-items:center;text-decoration:none;
    font-family:'Miriam Libre',serif;font-size:22px;font-weight:700;
    padding:20px 22px;border-radius:12px;border:1px solid var(--ink);
    background:var(--paper-card);color:var(--ink);
  }
  .choice small{display:block;font-family:'Varela Round',sans-serif;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px;}
  .choice .ar{font-size:26px;color:var(--muted);}
  .choice.dark{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.65);color:#fff;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
  .choice.dark small,.choice.dark .ar{color:rgba(255,255,255,.8);}
  .choice:active{transform:scale(.99);}

  /* ===== part view ===== */
  #topbar{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;
    padding:10px 12px;background:rgba(234,229,212,.97);border-bottom:1px solid var(--ink);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  #back{
    flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--ink);
    background:var(--paper-card);color:var(--ink);font-size:20px;cursor:pointer;line-height:1;
  }
  #menu{display:flex;gap:6px;overflow-x:auto;flex:1;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  #menu::-webkit-scrollbar{display:none;}
  #menu a{
    flex:0 0 auto;text-decoration:none;color:var(--muted);white-space:nowrap;
    font-family:'Miriam Libre',serif;font-weight:700;font-size:15px;
    border:1px solid var(--line);border-radius:20px;padding:7px 15px;background:var(--paper);
  }
  #menu a.on{background:var(--ink);color:#fff;border-color:var(--ink);}

  #content{max-width:900px;margin:0 auto;}
  .sec{scroll-margin-top:62px;}
  .sec-title{
    font-family:'Miriam Libre',serif;font-size:30px;font-weight:700;margin:0;
    padding:30px 20px 14px;
  }
  .sec.blocks{background:var(--paper-card);border-inline:1px solid var(--line-soft);}
  .sec.blocks + .sec.blocks{border-top:1px solid var(--ink);}
  .sec-inner{padding:0 20px 36px;}

  .block{margin-bottom:22px;}
  .block h3{font-family:'Miriam Libre',serif;font-size:17px;font-weight:700;margin:0 0 10px;}
  .block p{margin:0 0 14px;font-size:15px;line-height:1.85;}
  .block h4{font-family:'Miriam Libre',serif;font-size:20px;margin:34px 0 12px;padding-top:20px;border-top:1px dashed var(--line);}
  .block h4:first-child{margin-top:6px;border-top:none;padding-top:0;}
  ul.notes{list-style:none;margin:0;padding:0;}
  ul.notes li{position:relative;padding:9px 20px 9px 0;border-bottom:1px dashed var(--line-soft);font-size:15px;}
  ul.notes li:last-child{border-bottom:none;}
  ul.notes li::before{content:"–";position:absolute;right:0;color:var(--muted);}
  ol.notes{list-style:none;counter-reset:n;margin:0;padding:0;}
  ol.notes > li{counter-increment:n;position:relative;padding:9px 28px 9px 0;border-bottom:1px dashed var(--line-soft);font-size:15px;}
  ol.notes > li:last-child{border-bottom:none;}
  ol.notes > li::before{content:counter(n) ".";position:absolute;right:0;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:12px;top:12px;}
  ul.sub{list-style:none;margin:6px 0 0;padding:0;}
  ul.sub li{position:relative;font-size:14px;border-bottom:none;padding:4px 18px 4px 0;}
  ul.sub li::before{content:"–";position:absolute;right:0;color:var(--muted);}
  table.kv{width:100%;border-collapse:collapse;font-size:14.5px;margin:6px 0 4px;}
  table.kv td{padding:9px 10px;border:1px solid var(--line-soft);vertical-align:top;}
  table.kv td:first-child{width:22%;background:var(--paper);font-weight:700;white-space:nowrap;}
  a.ext{display:inline-block;margin:4px 0 12px;font-size:14px;}

  figure.inline-photo{margin:20px 0 22px;}
  /* תמונות מוצגות במלואן, בלי חיתוך; אם התמונה גבוהה, יהיו שוליים בצדדים */
  figure.inline-photo img{width:100%;height:auto;max-height:80vh;object-fit:contain;display:block;border-radius:6px;border:1px solid var(--line);background:var(--line-soft);min-height:120px;}
  figure.inline-photo.zoomable img{cursor:zoom-in;}
  .zoom-hint{font-size:12.5px;color:var(--muted);margin-top:6px;}
  .apple-only{display:none !important;}
  html.is-apple .apple-only{display:inline-flex !important;}
  html.is-apple .apple-only[hidden]{display:none !important;}
  .apple-btn{
    align-items:center;gap:6px;margin-top:8px;text-decoration:none;font-size:14px;
    color:var(--ink);background:var(--paper);border:1px solid var(--ink);border-radius:20px;padding:7px 16px;
  }
  figure.inline-photo figcaption{font-size:12px;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace;direction:ltr;text-align:right;}
  figure.inline-photo figcaption a{color:var(--muted);}

  /* embeds */
  .embed{margin:14px 0 20px;}
  .embed iframe{width:100%;border:none;border-radius:10px;display:block;}
  .embed .cap{font-size:12px;color:var(--muted);margin-top:5px;}
  .embed .cap a{color:var(--muted);}
  .yt{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;cursor:pointer;}
  .yt img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85;}
  .yt button{
    position:absolute;inset:0;margin:auto;width:64px;height:44px;border:none;border-radius:12px;
    background:#c4302b;color:#fff;font-size:20px;cursor:pointer;
  }
  .yt iframe{position:absolute;inset:0;height:100%;border-radius:0;}

  /* ===== story sections ===== */
  .sec.story{background:#1c1710;}
  .sec.story .sec-title{color:#fff;padding:26px 20px 18px;font-size:26px;}
  /* הטקסט בחלק העליון, כדי שהנושא בתחתית התמונה יישאר גלוי */
  .moment{
    min-height:min(82svh,680px);position:relative;display:flex;flex-direction:column;justify-content:flex-start;
    background-size:cover;background-position:center bottom;background-color:#2b2820;
  }
  .moment::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom, rgba(20,16,10,.92) 0%, rgba(20,16,10,.6) 38%, rgba(20,16,10,0) 66%);
  }
  .moment-text{position:relative;z-index:2;padding:26px 22px 40svh 40px;}
  .moment-text p.body{font-size:15px;line-height:1.75;margin:0 0 10px;color:#fff;}
  .moment-text .caption{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(255,255,255,.65);}
  .moment-text .map-pin{display:inline-flex;align-items:center;gap:3px;color:rgba(255,255,255,.65);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3);}
  .moment-text .extra-link{display:inline-block;margin-top:10px;font-size:12.5px;color:#fff;background:rgba(255,255,255,.14);border-radius:20px;padding:6px 12px;text-decoration:none;}
  .story-toc{
    position:fixed;top:50%;left:8px;transform:translateY(-50%);z-index:40;
    display:none;flex-direction:column;gap:8px;max-height:80vh;
  }
  .story-toc.show{display:flex;}
  .story-toc a{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.45);display:block;position:relative;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.25);}
  .story-toc a.current{background:#7BC08A;width:11px;height:11px;margin-left:-1px;}
  .story-toc a .label{
    position:absolute;left:18px;top:50%;transform:translateY(-50%);
    font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#fff;
    background:rgba(20,16,10,.78);padding:4px 9px;border-radius:5px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .story-toc a.current .label{opacity:1;}

  /* ===== music ===== */
  .sec.music{background:var(--paper-card);border-inline:1px solid var(--line-soft);}
  .music-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 8px;}
  .music-chips a{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink);text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:6px 12px;}
  .music-chips a.child{color:var(--muted);}
  .music-flow{padding:6px 20px 50px;}
  .music-flow h2.m-heading{font-family:'Miriam Libre',serif;font-size:22px;font-weight:700;margin:40px 0 16px;padding-top:20px;border-top:1px dashed var(--line);scroll-margin-top:62px;}
  .music-flow section:first-child h2.m-heading{margin-top:14px;padding-top:0;border-top:none;}
  .music-flow h3.m-subheading{font-family:'Miriam Libre',serif;font-size:18px;font-weight:700;margin:30px 0 12px;color:var(--stamp);scroll-margin-top:62px;}
  .music-flow p{margin:0 0 16px;font-size:15px;line-height:1.85;}

  .error-box{background:#F4E4DE;border:1px solid var(--stamp);border-radius:8px;padding:18px 20px;margin:20px;font-size:14px;color:#5A2E14;}
  .error-box code{background:rgba(0,0,0,0.08);padding:1px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;}

  /* ===== image viewer (zoom + pan) ===== */
  #zoomer{position:fixed;inset:0;z-index:200;background:#0f0c08;}
  #zstage{position:absolute;inset:0;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center;cursor:grab;}
  #zstage.drag{cursor:grabbing;}
  #zimg{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;}
  #zclose{
    position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;z-index:3;
    width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.5);
    background:rgba(20,16,10,.7);color:#fff;font-size:20px;cursor:pointer;line-height:1;
  }
  #zbar{
    position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:3;
    display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;
  }
  #zbar > *{pointer-events:auto;}
  #zctl{display:flex;gap:8px;}
  #zctl button{
    width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.45);
    background:rgba(20,16,10,.7);color:#fff;font-size:20px;cursor:pointer;line-height:1;
  }
  #zhint{font-size:12.5px;color:rgba(255,255,255,.75);background:rgba(20,16,10,.6);padding:5px 12px;border-radius:14px;transition:opacity .6s;}
  #zhint.off{opacity:0;}
  #zapple{background:rgba(255,255,255,.95);}

  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}
</style>
</head>
<body>

<main id="landing">
  <div class="land-inner">
    <div class="land-top">
      <h1 id="site-title"></h1>
      <p class="sub" id="site-subtitle"></p>
    </div>
    <div class="land-bottom">
      <div class="intro" id="site-intro"></div>
      <div class="choices" id="choices"></div>
    </div>
  </div>
</main>

<div id="view" hidden>
  <div id="topbar">
    <button id="back" aria-label="חזרה למסך הפתיחה">→</button>
    <nav id="menu"></nav>
  </div>
  <div id="content"></div>
</div>

<div id="zoomer" hidden role="dialog" aria-label="תצוגת מפה מוגדלת">
  <div id="zstage"><img id="zimg" alt="" draggable="false"></div>
  <button id="zclose" aria-label="סגירה">✕</button>
  <div id="zbar">
    <div id="zhint">צביטה להגדלה · גרירה להזזה · לחיצה כפולה לזום</div>
    <div id="zctl" dir="ltr"><button id="zout" aria-label="הקטנה">−</button><button id="zreset" aria-label="איפוס">⟲</button><button id="zin" aria-label="הגדלה">+</button></div>
    <a id="zapple" class="apple-btn apple-only" href="#" target="_blank" rel="noopener">פתח באפל מפות ↗</a>
  </div>
</div>

<script src="content.js" charset="utf-8"></script>
<script>
  if (typeof CONTENT === 'undefined') {
    document.body.innerHTML = `<div class="error-box"><b>לא הצלחתי לטעון את התוכן.</b><br>הקובץ <code>content.js</code> לא נמצא ליד <code>index.html</code>. ודאו ששניהם באותה תיקייה.</div>`;
    throw new Error('CONTENT is not defined');
  }

  const $ = id => document.getElementById(id);
  // מכשירי אפל (אייפון, אייפד, מק): רק להם מוצג הכפתור "פתח באפל מפות"
  if(/iPhone|iPad|iPod|Macintosh|MacIntel/.test(navigator.userAgent + ' ' + navigator.platform)) document.documentElement.classList.add('is-apple');
  const APPLE_URL = (CONTENT.meta && CONTENT.meta.appleMapsUrl) || '';
  // כפתור אפל מפות מוצג רק למפות הטיולים (MapTrip1-3), לא לכל מפה
  const isTripMap = b => !!(APPLE_URL && b.isMap && /^MapTrip/.test(b.img || ''));
  const IMG = n => `images/${n}.jpeg`;
  // smooth jump that re-aims if lazy-loading images shift the layout on the way
  function jumpTo(el){
    el.scrollIntoView({behavior:'smooth', block:'start'});
    const off = parseFloat(getComputedStyle(el).scrollMarginTop) || 0;
    let tries = 0, ok = 0;
    const iv = setInterval(() => {
      tries++;
      const d = Math.abs(el.getBoundingClientRect().top - off);
      if(d < 40){ if(++ok >= 2) clearInterval(iv); }
      else { ok = 0; el.scrollIntoView({behavior:'smooth', block:'start'}); }
      if(tries > 14) clearInterval(iv);
    }, 600);
  }

  function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function rich(t){
    return esc(t).replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
                 .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  }

  /* ---------- embeds ---------- */
  function ytId(url){
    const m = url.match(/(?:youtube\.com\/watch\?(?:.*&)?v=|youtu\.be\/)([\w-]{6,})/);
    return m ? m[1] : null;
  }
  function spotifyEmbed(url){
    const m = url.match(/open\.spotify\.com\/(track|playlist|album)\/([a-zA-Z0-9]+)/);
    return m ? { kind: m[1], src: `https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator` } : null;
  }
  function embedHtml(url, label){
    const id = ytId(url);
    if(id){
      return `<div class="embed"><div class="yt" data-yt="${id}">
          <img loading="lazy" src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="">
          <button aria-label="ניגון">▶</button></div>
        <div class="cap">${esc(label || '')} · <a href="${url}" target="_blank" rel="noopener">פתח ביוטיוב ↗</a></div></div>`;
    }
    const sp = spotifyEmbed(url);
    if(sp){
      const h = sp.kind === 'track' ? 152 : 232;
      return `<div class="embed"><iframe src="${sp.src}" height="${h}" loading="lazy" allow="encrypted-media; clipboard-write; fullscreen"></iframe>
        <div class="cap">${esc(label || '')} · <a href="${url}" target="_blank" rel="noopener">פתח ב-Spotify ↗</a></div></div>`;
    }
    return `<a class="ext" href="${url}" target="_blank" rel="noopener">${esc(label || url)} ↗</a>`;
  }
  document.addEventListener('click', e => {
    const yt = e.target.closest('.yt');
    if(!yt || yt.querySelector('iframe')) return;
    const id = yt.dataset.yt;
    yt.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  });

  /* ---------- blocks ---------- */
  function photoHtml(b, full){
    let cap = '';
    if(b.caption || b.mapUrl){
      cap = '<figcaption>' + (b.caption ? esc(b.caption) : '') +
        (b.mapUrl ? ` <a href="${b.mapUrl}" target="_blank" rel="noopener">📍 map</a>` : '') + '</figcaption>';
    }
    let extra = '';
    if(b.isMap){
      extra = '<div class="zoom-hint">🔍 לחצו על המפה כדי להגדיל ולהזיז</div>' +
        (isTripMap(b) ? `<a class="apple-btn apple-only" href="${APPLE_URL}" target="_blank" rel="noopener">פתח באפל מפות ↗</a>` : '');
    }
    return `<figure class="inline-photo${(b.isMap || full) ? ' map' : ''}${b.isMap ? ' zoomable' : ''}"${isTripMap(b) ? ' data-apple="1"' : ''}><img loading="lazy" src="${IMG(b.img)}" alt="" onerror="this.closest('figure').remove()">${cap}${extra}</figure>`;
  }
  function listHtml(items, ordered){
    let out = ordered ? '<ol class="notes">' : '<ul class="notes">';
    items.forEach(item => {
      out += `<li>${rich(item.text)}`;
      if(item.sub) out += '<ul class="sub">' + item.sub.map(x => `<li>${rich(x)}</li>`).join('') + '</ul>';
      out += '</li>';
    });
    return out + (ordered ? '</ol>' : '</ul>');
  }
  function blockHtml(b){
    if(b.type === 'photo') return photoHtml(b);
    if(b.type === 'h2') return `<div class="block"><h4>${esc(b.text)}</h4></div>`;
    if(b.type === 'link') return embedHtml(b.url, b.label);
    if(b.type === 'spotify') return embedHtml(b.url, b.label);
    let out = '<div class="block">';
    if(b.heading) out += `<h3>${esc(b.heading)}</h3>`;
    if(b.type === 'p') out += `<p>${rich(b.text)}</p>`;
    if(b.type === 'table') out += '<table class="kv">' + b.rows.map(r => `<tr><td>${esc(r[0])}</td><td>${rich(r[1])}</td></tr>`).join('') + '</table>';
    if(b.items) out += listHtml(b.items, b.ordered);
    return out + '</div>';
  }

  /* ---------- sections ---------- */
  function blocksSection(item){
    return `<section class="sec blocks" id="sec-${item.id}">
      <h2 class="sec-title">${esc(item.heading || item.label)}</h2>
      <div class="sec-inner">${item.blocks.map(blockHtml).join('')}</div></section>`;
  }

  function momentHtml(m, sid, i){
    const bg = m.img ? `data-bg="${IMG(m.img)}"` : '';
    let inner = '<div class="moment-text">';
    if(m.text) inner += `<p class="body">${esc(m.text)}</p>`;
    if(m.place || m.mapUrl){
      inner += '<div class="caption">';
      if(m.place) inner += `<span class="place">${esc(m.place)}</span>`;
      if(m.mapUrl) inner += `<a class="map-pin" href="${m.mapUrl}" target="_blank" rel="noopener">📍 map</a>`;
      inner += '</div>';
    }
    if(m.link) inner += `<a class="extra-link" href="${m.link.url}" target="_blank" rel="noopener">${esc(m.link.label)}</a>`;
    inner += '</div>';
    return `<div class="moment" id="${sid}-m${i}" ${bg}>${inner}</div>`;
  }
  function storySection(item){
    const moments = item.moments.map((m,i) => momentHtml(m, item.id, i)).join('');
    const dots = item.moments.map((m,i) =>
      `<a href="#${item.id}-m${i}" data-target="${item.id}-m${i}">${m.place ? `<span class="label">${esc(m.place)}</span>` : ''}</a>`).join('');
    return `<section class="sec story" id="sec-${item.id}" data-story="${item.id}">
      <h2 class="sec-title">${esc(item.label)}</h2>
      <nav class="story-toc" id="toc-${item.id}">${dots}</nav>
      ${moments}</section>`;
  }

  function musicSection(item){
    let chips = '';
    item.toc.forEach(t => {
      chips += `<a href="#${t.id}" data-jump="${t.id}">${esc(t.label)}</a>`;
      (t.children || []).forEach(c => { chips += `<a class="child" href="#${c.id}" data-jump="${c.id}">↳ ${esc(c.label)}</a>`; });
    });
    let flow = '';
    item.sections.forEach(sec => {
      flow += `<section id="${sec.id}"><h2 class="m-heading">${esc(sec.heading)}</h2>`;
      sec.blocks.forEach(b => {
        if(b.type === 'p') flow += `<p>${rich(b.text)}</p>`;
        else if(b.type === 'h3') flow += `<h3 class="m-subheading" id="${b.id}">${esc(b.text)}</h3>`;
        else if(b.type === 'photo') flow += photoHtml(b, true);
        else if(b.type === 'spotify' || b.type === 'link') flow += embedHtml(b.url, b.label);
      });
      flow += '</section>';
    });
    return `<section class="sec music" id="sec-${item.id}">
      <h2 class="sec-title">${esc(item.label)}</h2>
      <div class="music-chips">${chips}</div>
      <div class="music-flow">${flow}</div></section>`;
  }

  /* ---------- landing ---------- */
  $('site-title').textContent = CONTENT.meta.title;
  $('site-subtitle').textContent = CONTENT.meta.subtitle;
  $('site-intro').innerHTML = (CONTENT.meta.intro || '').split(/\n+/).filter(Boolean).map(t => `<p>${esc(t)}</p>`).join('');
  $('choices').innerHTML = CONTENT.parts.map((p, i) =>
    `<a class="choice${i === 1 ? ' dark' : ''}" href="#${p.id}"><span>${esc(p.button)}</span><span class="ar">‹</span></a>`).join('');

  /* ---------- part view ---------- */
  let observers = [];
  function clearObservers(){ observers.forEach(o => o.disconnect()); observers = []; }

  function showPart(id){
    const part = CONTENT.parts.find(p => p.id === id);
    clearObservers();
    document.querySelectorAll('.story-toc').forEach(t => t.classList.remove('show'));
    if(!part){
      $('view').hidden = true; $('landing').hidden = false; $('content').innerHTML = '';
      window.scrollTo(0, 0);
      return;
    }
    $('landing').hidden = true; $('view').hidden = false;

    $('menu').innerHTML = part.items.map(it => `<a href="#sec-${it.id}" data-sec="sec-${it.id}">${esc(it.label)}</a>`).join('');
    $('content').innerHTML = part.items.map(it =>
      it.kind === 'story' ? storySection(it) : it.kind === 'music' ? musicSection(it) : blocksSection(it)).join('');
    window.scrollTo(0, 0);

    // menu: jump + active highlight
    const links = [...$('menu').querySelectorAll('a')];
    links.forEach(a => a.addEventListener('click', e => {
      e.preventDefault();
      jumpTo(document.getElementById(a.dataset.sec));
    }));
    const secs = [...document.querySelectorAll('#content > .sec')];
    const ioSec = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if(en.isIntersecting) links.forEach(a => {
          const on = a.dataset.sec === en.target.id;
          a.classList.toggle('on', on);
          if(on) a.scrollIntoView({inline: 'center', block: 'nearest'});
        });
      });
    }, {rootMargin: '-30% 0px -60% 0px'});
    secs.forEach(s => ioSec.observe(s));
    observers.push(ioSec);
    links[0] && links[0].classList.add('on');

    // lazy background photos
    const ioBg = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if(en.isIntersecting){
          const el = en.target;
          if(el.dataset.bg){ el.style.backgroundImage = `url('${el.dataset.bg}')`; delete el.dataset.bg; }
          ioBg.unobserve(el);
        }
      });
    }, {rootMargin: '150% 0px'});
    document.querySelectorAll('.moment').forEach(m => ioBg.observe(m));
    observers.push(ioBg);

    // story dot navs
    document.querySelectorAll('.sec.story').forEach(sec => {
      const toc = sec.querySelector('.story-toc');
      const dots = [...toc.querySelectorAll('a')];
      dots.forEach(a => a.addEventListener('click', e => {
        e.preventDefault();
        dots.forEach(d => d.classList.remove('current'));
        a.classList.add('current');
        jumpTo(document.getElementById(a.dataset.target));
      }));
      dots[0] && dots[0].classList.add('current');
      const ioShow = new IntersectionObserver(entries => {
        entries.forEach(en => toc.classList.toggle('show', en.isIntersecting));
      }, {rootMargin: '-45% 0px -45% 0px'});
      ioShow.observe(sec); observers.push(ioShow);
      const ioCur = new IntersectionObserver(entries => {
        entries.forEach(en => {
          if(en.isIntersecting) dots.forEach(d => d.classList.toggle('current', d.dataset.target === en.target.id));
        });
      }, {threshold: 0.5});
      sec.querySelectorAll('.moment').forEach(m => ioCur.observe(m));
      observers.push(ioCur);
    });

    // music chips jump
    document.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', e => {
      e.preventDefault();
      jumpTo(document.getElementById(a.dataset.jump));
    }));
  }

  /* ---------- image viewer: pinch / drag / wheel / double-tap ---------- */
  (function(){
    const zoomer = $('zoomer'), stage = $('zstage'), zimg = $('zimg'), hint = $('zhint');
    const Z = {s:1, x:0, y:0};
    const isTouch = 'ontouchstart' in window;
    const pts = new Map();
    let pinch = null, tap = null, lastTap = null, moved = false, hintTimer = null;

    function size(){ const r = stage.getBoundingClientRect(); return {W:r.width, H:r.height, L:r.left, T:r.top}; }
    function apply(){
      const {W,H} = size(), w = zimg.offsetWidth, h = zimg.offsetHeight;
      const mx = Math.max(0, (w*Z.s - W)/2) + 60, my = Math.max(0, (h*Z.s - H)/2) + 60;
      Z.x = Math.max(-mx, Math.min(mx, Z.x)); Z.y = Math.max(-my, Math.min(my, Z.y));
      zimg.style.transform = `translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;
    }
    function zoomAt(cx, cy, ns){
      ns = Math.max(1, Math.min(6, ns));
      const {W,H,L,T} = size(), px = cx - L - W/2, py = cy - T - H/2, k = ns / Z.s;
      Z.x = px - (px - Z.x) * k; Z.y = py - (py - Z.y) * k; Z.s = ns;
      if(Z.s === 1){ Z.x = 0; Z.y = 0; }
      apply();
    }
    function reset(){ Z.s = 1; Z.x = 0; Z.y = 0; apply(); }
    function zoomCenter(f){ const {W,H,L,T} = size(); zoomAt(L + W/2, T + H/2, Z.s * f); }

    function open(src, apple){
      zimg.src = src; reset();
      const a = $('zapple'); a.href = APPLE_URL || '#'; a.hidden = !apple;
      zoomer.hidden = false; document.body.style.overflow = 'hidden';
      hint.classList.remove('off'); clearTimeout(hintTimer); hintTimer = setTimeout(() => hint.classList.add('off'), 3500);
    }
    function close(){ zoomer.hidden = true; document.body.style.overflow = ''; pts.clear(); pinch = null; }

    document.addEventListener('click', e => {
      const img = e.target.closest('figure.zoomable img');
      if(img) open(img.currentSrc || img.src, !!img.closest('figure').dataset.apple);
    });
    window.addEventListener('hashchange', close);
    $('zclose').addEventListener('click', close);
    $('zin').addEventListener('click', () => zoomCenter(1.5));
    $('zout').addEventListener('click', () => zoomCenter(1/1.5));
    $('zreset').addEventListener('click', reset);
    document.addEventListener('keydown', e => {
      if(zoomer.hidden) return;
      if(e.key === 'Escape') close();
      else if(e.key === '+' || e.key === '=') zoomCenter(1.4);
      else if(e.key === '-') zoomCenter(1/1.4);
      else if(e.key === '0') reset();
    });
    window.addEventListener('resize', () => { if(!zoomer.hidden) apply(); });

    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    stage.addEventListener('pointerdown', e => {
      stage.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
      stage.classList.add('drag');
      if(pts.size === 1){ tap = {x:e.clientX, y:e.clientY, t:Date.now()}; moved = false; }
      if(pts.size === 2){
        const [a, b] = [...pts.values()];
        pinch = {d:dist(a, b) || 1, s:Z.s, mx:(a.x + b.x)/2, my:(a.y + b.y)/2};
        moved = true;
      }
    });
    stage.addEventListener('pointermove', e => {
      const p = pts.get(e.pointerId); if(!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      if(pts.size === 2 && pinch){
        const [a, b] = [...pts.values()], mx = (a.x + b.x)/2, my = (a.y + b.y)/2;
        zoomAt(mx, my, pinch.s * dist(a, b) / pinch.d);
        Z.x += mx - pinch.mx; Z.y += my - pinch.my; pinch.mx = mx; pinch.my = my; apply();
      } else if(pts.size === 1){
        if(tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 8) moved = true;
        if(Z.s > 1){ Z.x += dx; Z.y += dy; apply(); }
      }
    });
    function up(e){
      if(!pts.has(e.pointerId)) return;
      const wasOne = pts.size === 1;
      pts.delete(e.pointerId);
      if(pts.size < 2) pinch = null;
      if(pts.size === 0) stage.classList.remove('drag');
      if(wasOne && tap && !moved && Date.now() - tap.t < 300){
        const now = Date.now();
        if(lastTap && now - lastTap.t < 320 && Math.hypot(tap.x - lastTap.x, tap.y - lastTap.y) < 30){
          if(Z.s > 1.05) reset(); else zoomAt(tap.x, tap.y, 2.6);
          lastTap = null;
        } else lastTap = {t:now, x:tap.x, y:tap.y};
      }
    }
    stage.addEventListener('pointerup', up);
    stage.addEventListener('pointercancel', up);
    stage.addEventListener('wheel', e => {
      e.preventDefault();
      if(e.ctrlKey || Z.s === 1) zoomAt(e.clientX, e.clientY, Z.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.002)));
      else { Z.x -= e.deltaX; Z.y -= e.deltaY; apply(); }
    }, {passive:false});
    // Safari desktop trackpad pinch
    let gs = 1;
    stage.addEventListener('gesturestart', e => { e.preventDefault(); gs = Z.s; });
    stage.addEventListener('gesturechange', e => { e.preventDefault(); if(!isTouch) zoomAt(e.clientX, e.clientY, gs * e.scale); });
    stage.addEventListener('gestureend', e => e.preventDefault());
  })();

  $('back').addEventListener('click', () => { location.hash = ''; });
  function route(){ showPart(location.hash.replace('#', '')); }
  window.addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
